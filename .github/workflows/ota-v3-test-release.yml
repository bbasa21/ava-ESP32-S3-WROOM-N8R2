name: AVA OTA V2 Test Release

# Explicit unsigned staging trigger. Publishes only to work/ota-v3-hardening.
on:
  push:
    branches:
      - work/ota-v3-hardening
    paths:
      - "ota/test-release.trigger"

permissions:
  contents: write

concurrency:
  group: ava-ota-v2-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO and image validator
        run: |
          python -m pip install --disable-pip-version-check platformio "esptool==4.8.1"

      - name: Generate staging build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((20000 + GITHUB_RUN_NUMBER))
          cat > include/Ava_BuildInfo.h <<EOF
          #ifndef AVA_BUILD_INFO_H
          #define AVA_BUILD_INFO_H
          #define AVA_BUILD_NUMBER ${BUILD_NUMBER}
          #define AVA_BUILD_VERSION "0.0.0"
          #define AVA_BUILD_COMMIT "${GITHUB_SHA}"
          #endif
          EOF
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build staging-channel firmware
        run: pio run -e ava_ota_v2_test

      - name: Validate ESP firmware image
        shell: bash
        run: |
          set -euo pipefail
          FIRMWARE=".pio/build/ava_ota_v2_test/firmware.bin"
          test -s "$FIRMWARE"
          python -m esptool image_info "$FIRMWARE"

      - name: Prepare unsigned staging release files
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail
          FIRMWARE=".pio/build/ava_ota_v2_test/firmware.bin"
          mkdir -p release
          cp "$FIRMWARE" release/ava-firmware.bin
          sha256sum release/ava-firmware.bin | awk '{print $1}' > release/sha256.txt
          FIRMWARE_SIZE=$(stat -c%s release/ava-firmware.bin)
          cat > release/manifest.json <<EOF
          {
            "schema": 2,
            "build": ${BUILD_NUMBER},
            "version": "0.0.0",
            "commit": "${GITHUB_SHA}",
            "firmware_url": "https://github.com/bbasa21/ava-ESP32-S3-WROOM-N8R2/releases/download/ota-v2-test-${BUILD_NUMBER}/ava-firmware.bin",
            "size": ${FIRMWARE_SIZE},
            "sha256": "$(cat release/sha256.txt)"
          }
          EOF

      - name: Create staging GitHub release (direct REST API diagnostic)
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "ota-v2-test-${{ steps.metadata.outputs.build_number }}";

            core.info(`Creating staging release for ${tag} at ${context.sha}`);
            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: "AVA OTA V2 TEST Build #${{ steps.metadata.outputs.build_number }}",
              prerelease: true,
              draft: false,
              generate_release_notes: false
            });

            core.info(`Release created: id=${created.data.id}, url=${created.data.html_url}`);

            for (const file of [
              "release/ava-firmware.bin",
              "release/manifest.json",

              "release/sha256.txt"
            ]) {
              const data = fs.readFileSync(file);
              core.info(`Uploading ${file} (${data.length} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: created.data.id,
                name: file.split("/").pop(),
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length
                }
              });
            }

            core.info("All staging release assets uploaded successfully.");

      - name: Publish staging manifest to hardening branch only
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const branch = "work/ota-v3-hardening";

            async function publish(filePath, fileContent, message) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: branch
                });
                if (!Array.isArray(current.data) && current.data.sha) {
                  sha = current.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message,
                content: Buffer.from(fileContent, "utf8").toString("base64"),
                branch,
                ...(sha ? { sha } : {})
              });
            }

            await publish(
              "ota/v2-test-manifest.json",
              fs.readFileSync("release/manifest.json", "utf8"),
              "Publish OTA V2 staging manifest"
            );
