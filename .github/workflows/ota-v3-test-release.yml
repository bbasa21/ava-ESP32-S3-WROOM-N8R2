name: AVA OTA V3 Test Release

# Deliberately push-triggered only by an explicit staging trigger file.
# It never publishes to main or changes the production OTA manifest.
on:
  push:
    branches:
      - feature/ota-v3
    paths:
      - "ota/test-release.trigger"

permissions:
  contents: write

concurrency:
  group: ava-ota-v3-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ota-v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO and image validator
        run: |
          python -m pip install --disable-pip-version-check platformio "esptool==4.8.1"

      - name: Generate staging build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((20000 + GITHUB_RUN_NUMBER))
          cat > include/Ava_BuildInfo.h <<EOF
          #ifndef AVA_BUILD_INFO_H
          #define AVA_BUILD_INFO_H
          #define AVA_BUILD_NUMBER ${BUILD_NUMBER}
          #define AVA_BUILD_VERSION "0.0.0"
          #define AVA_BUILD_COMMIT "${GITHUB_SHA}"
          #endif
          EOF
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build staging-channel firmware
        run: pio run -e ava_ota_v3_test

      - name: Validate ESP firmware image
        shell: bash
        run: |
          set -euo pipefail
          FIRMWARE=".pio/build/ava_ota_v3_test/firmware.bin"
          test -s "$FIRMWARE"
          python -m esptool image_info "$FIRMWARE"

      - name: Prepare signed staging release files
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail
          FIRMWARE=".pio/build/ava_ota_v3_test/firmware.bin"
          mkdir -p release
          cp "$FIRMWARE" release/ava-firmware.bin
          sha256sum release/ava-firmware.bin | awk '{print $1}' > release/sha256.txt
          FIRMWARE_SIZE=$(stat -c%s release/ava-firmware.bin)
          cat > release/manifest.json <<EOF
          {
            "schema": 3,
            "build": ${BUILD_NUMBER},
            "version": "0.0.0",
            "commit": "${GITHUB_SHA}",
            "firmware_url": "https://github.com/bbasa21/ava-ESP32-S3-WROOM-N8R2/releases/download/ota-v3-test-${BUILD_NUMBER}/ava-firmware.bin",
            "size": ${FIRMWARE_SIZE},
            "sha256": "$(cat release/sha256.txt)"
          }
          EOF

      - name: Sign staging manifest (ECDSA P-256 / SHA-256)
        shell: bash
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.AVA_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_PRIVATE_KEY" || {
            echo "Missing repository secret AVA_OTA_SIGNING_PRIVATE_KEY." >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/ava-ota-staging-key.pem"
          public_file="$RUNNER_TEMP/ava-ota-staging-public.pem"
          signature_der="$RUNNER_TEMP/ava-ota-staging-manifest.sig.der"
          trap 'rm -f "$key_file" "$public_file" "$signature_der"' EXIT
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -pubout -out "$public_file"
          python tools/verify_ota_v3_public_key.py "$public_file" include/Ava_OTA_V3_PublicKey.h
          openssl dgst -sha256 -sign "$key_file" -out "$signature_der" release/manifest.json
          base64 -w0 "$signature_der" > release/manifest.sig
          test -s release/manifest.sig

      - name: Create staging GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-v3-test-${{ steps.metadata.outputs.build_number }}
          target_commitish: ${{ github.sha }}
          name: "AVA OTA V3 TEST Build #${{ steps.metadata.outputs.build_number }}"
          prerelease: true
          generate_release_notes: false
          files: |
            release/ava-firmware.bin
            release/manifest.json
            release/manifest.sig
            release/sha256.txt

      - name: Publish staging manifest to feature branch only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const branch = "feature/ota-v3";

            async function publish(filePath, fileContent, message) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: branch
                });
                if (!Array.isArray(current.data) && current.data.sha) {
                  sha = current.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message,
                content: Buffer.from(fileContent, "utf8").toString("base64"),
                branch,
                ...(sha ? { sha } : {})
              });
            }

            // Publish signature first; manifest is the final commit marker.
            await publish(
              "ota/v3-test-manifest.sig",
              fs.readFileSync("release/manifest.sig", "utf8"),
              "Publish OTA V3 staging signature"
            );
            await publish(
              "ota/v3-test-manifest.json",
              fs.readFileSync("release/manifest.json", "utf8"),
              "Publish OTA V3 staging manifest"
            );
