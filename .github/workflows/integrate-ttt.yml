name: Integrate Tic Tac Toe BLE

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/integrate-ttt.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration patch
        run: python3 tools/integrate_ttt.py

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/Ava_Bluetooth.h
          if git diff --cached --quiet; then
            echo 'No integration changes needed.'
          else
            git commit -m 'Integrate Tic-Tac-Toe into AVA BLE game flow'
            git push
          fi
