name: AVA Firmware CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions/**"
      - "boards/**"
      - "data/**"
      - "default_8MB.csv"
      - ".github/workflows/**"
  push:
    branches-ignore: [main]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions/**"
      - "boards/**"
      - "data/**"
      - "default_8MB.csv"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e ava
