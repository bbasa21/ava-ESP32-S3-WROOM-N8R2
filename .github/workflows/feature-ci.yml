name: AVA Feature Branch CI

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/feature-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build AVA firmware
        run: pio run -e ava
