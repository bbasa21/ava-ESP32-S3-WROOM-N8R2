name: AVA Firmware Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions/**"
      - "boards/**"
      - "data/**"
      - "default_8MB.csv"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate build metadata
        shell: bash
        run: |
          set -e

          cat > include/Ava_BuildInfo.h <<EOF
          #ifndef AVA_BUILD_INFO_H
          #define AVA_BUILD_INFO_H

          #define AVA_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          #define AVA_BUILD_VERSION "0.0.0"
          #define AVA_BUILD_COMMIT "${GITHUB_SHA}"

          #endif
          EOF

      - name: Build firmware
        run: pio run -e ava

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          FIRMWARE=".pio/build/ava/firmware.bin"

          if [ ! -f "$FIRMWARE" ]; then
            echo "Firmware binary not found: $FIRMWARE"
            exit 1
          fi

          mkdir -p release

          cp "$FIRMWARE" release/ava-firmware.bin
          sha256sum release/ava-firmware.bin | awk '{print $1}' > release/sha256.txt

          cat > release/manifest.json <<EOF
          {
            "build": ${GITHUB_RUN_NUMBER},
            "version": "0.0.0",
            "commit": "${GITHUB_SHA}",
            "firmware_url": "https://github.com/bbasa21/ava-ESP32-S3-WROOM-N8R2/releases/download/firmware-${GITHUB_RUN_NUMBER}/ava-firmware.bin",
            "sha256": "$(cat release/sha256.txt)"
          }
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-firmware
          path: release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_number }}
          name: "AVA Firmware Build #${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release/ava-firmware.bin
            release/manifest.json
            release/sha256.txt

      - name: Publish latest OTA manifest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = "ota/manifest.json";
            const content = Buffer.from(
              fs.readFileSync("release/manifest.json", "utf8")
            ).toString("base64");
            let sha;

            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              });

              if (!Array.isArray(current.data) && current.data.sha) {
                sha = current.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "Update OTA manifest for build #" + process.env.GITHUB_RUN_NUMBER,
              content,
              ...(sha ? { sha } : {})
            });
