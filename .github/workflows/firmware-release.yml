name: AVA Firmware Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - "partitions/**"
      - "boards/**"
      - "data/**"
      - "default_8MB.csv"
      - ".github/workflows/firmware-release.yml"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate build metadata
        shell: bash
        run: |
          set -e
          cat > include/Ava_BuildInfo.h <<EOF
          #ifndef AVA_BUILD_INFO_H
          #define AVA_BUILD_INFO_H
          #define AVA_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          #define AVA_BUILD_VERSION "0.0.0"
          #define AVA_BUILD_COMMIT "${GITHUB_SHA}"
          #endif
          EOF

      - name: Build firmware
        run: pio run -e ava

      - name: Validate ESP firmware image
        shell: bash
        run: |
          set -e
          python -m pip install --disable-pip-version-check "esptool==4.8.1"
          FIRMWARE=".pio/build/ava/firmware.bin"
          test -s "$FIRMWARE"
          python -m esptool image_info "$FIRMWARE"

      - name: Prepare release files
        shell: bash
        run: |
          set -e
          FIRMWARE=".pio/build/ava/firmware.bin"
          test -s "$FIRMWARE"
          mkdir -p release
          cp "$FIRMWARE" release/ava-firmware.bin
          sha256sum release/ava-firmware.bin | awk '{print $1}' > release/sha256.txt
          firmware_size=$(stat -c%s release/ava-firmware.bin)
          cat > release/manifest.json <<EOF
          {
            "schema": 3,
            "build": ${GITHUB_RUN_NUMBER},
            "version": "0.0.0",
            "commit": "${GITHUB_SHA}",
            "firmware_url": "https://github.com/bbasa21/ava-ESP32-S3-WROOM-N8R2/releases/download/firmware-${GITHUB_RUN_NUMBER}/ava-firmware.bin",
            "size": ${firmware_size},
            "sha256": "$(cat release/sha256.txt)"
          }
          EOF

      - name: Sign release manifest (ECDSA P-256 / SHA-256)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.AVA_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_PRIVATE_KEY" || {
            echo "Missing repository secret AVA_OTA_SIGNING_PRIVATE_KEY." >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/ava-ota-signing-key.pem"
          public_file="$RUNNER_TEMP/ava-ota-signing-public.pem"
          signature_der="$RUNNER_TEMP/ava-ota-manifest.sig.der"
          trap 'rm -f "$key_file" "$public_file" "$signature_der"' EXIT
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -pubout -out "$public_file"
          python tools/verify_ota_v3_public_key.py "$public_file" include/Ava_OTA_V3_PublicKey.h
          openssl dgst -sha256 -sign "$key_file" -out "$signature_der" release/manifest.json
          base64 -w0 "$signature_der" > release/manifest.sig
          test -s release/manifest.sig

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-firmware
          path: release/

      # A workflow_dispatch on an experimental branch is build-only.
      # Releases and the production OTA manifest are published from main only.
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_number }}
          name: "AVA Firmware Build #${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release/ava-firmware.bin
            release/manifest.json
            release/sha256.txt
            release/manifest.sig

      - name: Publish latest OTA manifest
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = "ota/manifest.json";
            const content = Buffer.from(
              fs.readFileSync("release/manifest.json", "utf8")
            ).toString("base64");
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              if (!Array.isArray(current.data) && current.data.sha) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            async function publish(filePath, fileContent, message) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: "main"
                });
                if (!Array.isArray(current.data) && current.data.sha) sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message,
                content: Buffer.from(fileContent, "utf8").toString("base64"),
                branch: "main",
                ...(sha ? { sha } : {})
              });
            }
            // Publish signature first and the manifest last as the commit marker.
            await publish(
              "ota/manifest.sig",
              fs.readFileSync("release/manifest.sig", "utf8"),
              "Publish OTA signature for build #" + process.env.GITHUB_RUN_NUMBER
            );
            await publish(
              path,
              fs.readFileSync("release/manifest.json", "utf8"),
              "Publish signed OTA manifest for build #" + process.env.GITHUB_RUN_NUMBER
            );
