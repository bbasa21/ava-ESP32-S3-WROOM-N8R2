[env:ava]

platform = espressif32

board = rymcu-esp32-s3-devkitc-1

framework = arduino

; ESP32-S3-WROOM-1-N8R2
; Flash: 8MB QD
; PSRAM: 2MB QD

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

board_build.partitions = default_8MB.csv
build_src_filter =
    +<*>
    -<Ava_OTA_V3*.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
    https://github.com/olikraus/U8g2_Arduino.git#b3a40de8822187c941b40cbbaaa77604a7ab90c7

; Isolated OTA V3 staging channel. It reads only the feature-branch test manifest.
; Never use this environment for production releases.
[env:ava_ota_v3_test]
extends = env:ava
build_flags =
    ${env:ava.build_flags}
    -DAVA_OTA_V3_TEST_CHANNEL

; Isolated OTA V3 validator test environment
[env:ava_ota_v3_validator_test]
extends = env:ava_ota_v3_test
test_build_src = yes
build_src_filter =
    +<Ava_OTA_V3_Manifest.cpp>

; Isolated OTA V2 staging channel.
; Uses direct HTTPS release URLs and SHA-256 integrity verification.
[env:ava_ota_v2_test]
extends = env:ava
build_flags =
    ${env:ava.build_flags}
    -DAVA_OTA_V2_TEST_CHANNEL